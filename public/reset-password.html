<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password &mdash; NovaCart</title>
  <meta name="description" content="Choose a new NovaCart password." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="assets/images/auth-bg.jpg" />

  <!-- Brand mark. favicon.ico sits at the web root as well, for the path
       browsers still probe before reading any of this. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#020829" />
</head>

<body class="authx">

  <a href="index.html" class="authx__brand" aria-label="NovaCart home">
    <span class="authx__brandmark" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="38" height="38" decoding="async" /></span>
    <span class="authx__brandtext">Nova<span>Cart</span></span>
  </a>

  <main class="authx__stage">
    <section class="authx__card">

      <!-- Replaces the "Back to sign in" footer. A dismiss affordance in the
           corner is the convention for a card you can back out of, and it
           frees the bottom of the card entirely. It navigates, so it is a
           link with a label rather than a button. -->
      <a href="login.html" class="authx__close" aria-label="Back to sign in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </a>

      <span class="authx__badge" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="54" height="54" decoding="async" /></span>

      <h1 class="authx__title">Choose a new password</h1>
      <p class="authx__sub">Pick something you have not used here before.</p>

        <div class="auth-alert" id="authAlert" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" /><path d="M12 8v5M12 16.5v.01" />
          </svg>
          <span id="authAlertText"></span>
        </div>

        <form id="resetForm" novalidate>
          <div class="field ffield--icon ffield ffield--password">
            <span class="ffield__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
            <input type="password" id="rpPassword" name="password" autocomplete="new-password" required placeholder=" " />
            <label for="rpPassword">New password</label>
            <button type="button" class="pw-toggle js-pw-toggle" aria-label="Show password" aria-pressed="false" data-target="rpPassword">
              <svg class="pw-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="pw-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19 19 0 0 1 5.1-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a19 19 0 0 1-2.2 3.2M1 1l22 22" />
              </svg>
            </button>
            <span class="field-error">Use at least 8 characters, with a letter and a number.</span>
          </div>

          <div class="pw-strength" id="pwStrength" data-score="0">
            <div class="pw-strength__bar" aria-hidden="true">
              <span class="pw-strength__seg"></span><span class="pw-strength__seg"></span>
              <span class="pw-strength__seg"></span><span class="pw-strength__seg"></span>
            </div>
            <span class="pw-strength__label" id="pwStrengthLabel">Use 8+ characters with a letter and a number</span>
          </div>

          <div class="field ffield--icon ffield ffield--password">
            <span class="ffield__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.2 2.9 7.4 7 8.5 4.1-1.1 7-4.3 7-8.5V6l-7-3Z"/><path d="m9 11.5 2 2 3.5-3.8"/></svg></span>
            <input type="password" id="rpConfirm" name="confirm" autocomplete="new-password" required placeholder=" " />
            <label for="rpConfirm">Confirm new password</label>
            <button type="button" class="pw-toggle js-pw-toggle" aria-label="Show password" aria-pressed="false" data-target="rpConfirm">
              <svg class="pw-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="pw-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19 19 0 0 1 5.1-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a19 19 0 0 1-2.2 3.2M1 1l22 22" />
              </svg>
            </button>
            <span class="field-error">Both passwords need to match.</span>
          </div>

          <button type="submit" class="btn btn--accent btn--lg btn--block" id="resetBtn">
            Update Password <span class="btn__arrow" aria-hidden="true">&rarr;</span>
          </button>
        </form>

        <div class="form-success" id="resetSuccess" hidden>
          <span class="cart-empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <h2>Password updated</h2>
          <p>You can now sign in with your new password.</p>
          <a href="login.html" class="btn btn--accent btn--lg">Go to Sign In</a>
        </div>


    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reset-page.js"></script>
</body>
</html>
