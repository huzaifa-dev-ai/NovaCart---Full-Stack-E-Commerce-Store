<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your NovaCart account to track orders, save your details and check out faster." />
  <title>Sign In — NovaCart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- The photograph is the page here, so fetch it alongside the stylesheet
       rather than waiting for CSS to discover it. -->
  <link rel="preload" as="image" href="assets/images/auth-bg.jpg" />

  <!-- Brand mark. favicon.ico sits at the web root as well, for the path
       browsers still probe before reading any of this. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#020829" />
</head>

<!-- No site header on purpose: this page is a single decision, and the usual
     navigation only offers ways to abandon it. The wordmark below is the way
     back. main.js guards every header hook, so its absence is harmless. -->
<body class="authx">

  <a href="index.html" class="authx__brand" aria-label="NovaCart home">
    <span class="authx__brandmark" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="38" height="38" decoding="async" /></span>
    <span class="authx__brandtext">Nova<span>Cart</span></span>
  </a>

  <main class="authx__stage">
    <section class="authx__card">

      <span class="authx__badge" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="54" height="54" decoding="async" /></span>

      <h1 class="authx__title">Welcome back</h1>
      <p class="authx__sub">Sign in to track orders and check out faster.</p>

      <div class="auth-alert" id="authAlert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><path d="M12 8v5M12 16.5v.01" />
        </svg>
        <span id="authAlertText"></span>
      </div>

      <!-- Google Sign-In. Hidden until /api/auth/google/status confirms
           the server actually has credentials, so a button that cannot
           work never appears. The gate lives in the href so a middle-click
           runs the same door a normal click would. -->
      <div class="auth-federated" id="googleBlock" hidden>
        <a class="btn btn--google btn--lg btn--block" id="googleBtn" href="/api/auth/google?intent=login" rel="nofollow">
          <svg class="btn__gmark" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"/><path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.9641 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z"/></svg>
          <span>Continue with Google</span>
        </a>
        <div class="auth-divider"><span>or sign in with email</span></div>
      </div>

      <form id="loginForm" novalidate>

        <!-- placeholder=" " is load-bearing: :placeholder-shown is what tells
             the label whether to sit in the box or float above it. -->
        <div class="field ffield--icon ffield">
          <span class="ffield__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="m3.5 7 7.3 5.2a2 2 0 0 0 2.4 0L20.5 7"/></svg></span>
          <input type="email" id="liEmail" name="email" autocomplete="email" placeholder=" " required />
          <label for="liEmail">E-mail address</label>
          <span class="field-error">That email address doesn't look right.</span>
        </div>

        <div class="field ffield--icon ffield ffield--password">
          <span class="ffield__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
          <input type="password" id="liPassword" name="password" autocomplete="current-password" placeholder=" " required />
          <label for="liPassword">Password</label>
          <button type="button" class="pw-toggle js-pw-toggle" aria-label="Show password" aria-pressed="false" data-target="liPassword">
            <svg class="pw-toggle__on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="pw-toggle__off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19 19 0 0 1 5.1-5.9M9.9 4.2A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a19 19 0 0 1-2.2 3.2M1 1l22 22" />
            </svg>
          </button>
          <span class="field-error">Please enter your password.</span>
        </div>

        <div class="authx__row">
          <label class="check">
            <input type="checkbox" id="liRemember" name="remember" checked />
            <span>Keep me signed in</span>
          </label>
          <a href="forgot-password.html" class="authx__link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--accent btn--lg btn--block btn--pill" id="loginBtn">
          Sign In <span class="btn__arrow" aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <p class="authx__foot">
        New to NovaCart? <a href="register.html" id="toRegister">Create an account</a>
      </p>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
