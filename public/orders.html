<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Orders — NovaCart</title>
  <meta name="description" content="Track your NovaCart orders and start a return." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="siteHeader">
    <div class="container header__inner">

      <a href="index.html" class="brand" aria-label="NovaCart home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6" />
            <circle cx="10" cy="20" r="1.4" /><circle cx="18" cy="20" r="1.4" />
          </svg>
        </span>
        <span class="brand__text">Nova<span class="brand__accent">Cart</span></span>
      </a>

      <nav class="nav" id="primaryNav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="index.html">Home</a></li>
          <li><a class="nav__link" href="products.html">Products</a></li>
          <li><a class="nav__link" href="about.html">About</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <div class="account" id="accountSlot"></div>

        <a href="cart.html" class="cart-btn" aria-label="View shopping cart">
          <svg class="cart-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6" />
            <circle cx="10" cy="20" r="1.4" /><circle cx="18" cy="20" r="1.4" />
          </svg>
          <span class="cart-btn__label">Cart</span>
          <span class="cart-badge" id="cartCount" data-empty="true">0</span>
        </a>

        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">
          <span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Hidden until the sign-in check passes -->
  <main id="ordersRoot" hidden>
    <section class="page-hero">
      <div class="container">
        <span class="page-hero__eyebrow">Your Account</span>
        <h1 class="page-hero__title">Orders &amp; returns</h1>
        <p class="page-hero__sub">
          Track deliveries, review what you bought, and start a return within 30 days.
        </p>
      </div>
    </section>

    <section class="page-body">
      <div class="container">

        <div class="acct-tabs" role="tablist">
          <button type="button" class="acct-tab is-active" data-tab="orders" role="tab" aria-selected="true">
            Orders <span class="acct-tab__count" id="tabOrdersCount"></span>
          </button>
          <button type="button" class="acct-tab" data-tab="returns" role="tab" aria-selected="false">
            Returns <span class="acct-tab__count" id="tabReturnsCount"></span>
          </button>
        </div>

        <div id="ordersPanel">
          <div class="order-list" id="orderList">
            <div class="grid-state" role="status">Loading your orders…</div>
          </div>
        </div>

        <div id="returnsPanel" hidden>
          <div class="order-list" id="returnList">
            <div class="grid-state" role="status">Loading your returns…</div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Slide-over for order detail and the return form -->
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer__scrim" data-close="1"></div>
    <div class="drawer__panel">
      <div class="drawer__head">
        <h3 id="drawerTitle">Order</h3>
        <button type="button" class="icon-btn" data-close="1" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
      <div class="drawer__foot" id="drawerFoot" hidden></div>
    </div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer" id="footer">
    <div class="container footer__bottom">
      <p>&copy; <span id="year">2026</span> NovaCart. All rights reserved.</p>
      <p class="footer__credit">Built for the CodeAlpha Full Stack Internship.</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/orders-page.js"></script>
</body>
</html>
