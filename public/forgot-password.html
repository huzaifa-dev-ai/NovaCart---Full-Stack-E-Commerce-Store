<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password &mdash; NovaCart</title>
  <meta name="description" content="Reset your NovaCart password." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..640;1,9..144,400..640&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="assets/images/auth-bg.jpg" />

  <!-- Synchronous on purpose: it must set the page's state before the first
       paint, or the email form flashes up and disappears. Kept tiny so the
       parser blocks for as little time as possible. -->
  <script src="js/reset-precheck.js"></script>

  <!-- Brand mark. favicon.ico sits at the web root as well, for the path
       browsers still probe before reading any of this. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#020829" />
</head>

<body class="authx">

  <a href="index.html" class="authx__brand" aria-label="NovaCart home">
    <span class="authx__brandmark" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="38" height="38" decoding="async" /></span>
    <span class="authx__brandtext">Nova<span>Cart</span></span>
  </a>

  <main class="authx__stage">
    <section class="authx__card">

      <!-- Replaces the "Back to sign in" footer. A dismiss affordance in the
           corner is the convention for a card you can back out of, and it
           frees the bottom of the card entirely. It navigates, so it is a
           link with a label rather than a button. -->
      <a href="login.html" class="authx__close" aria-label="Back to sign in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </a>

      <span class="authx__badge" aria-hidden="true"><img src="assets/icons/logo-mark.png" alt="" width="54" height="54" decoding="async" /></span>

      <h1 class="authx__title">Reset your password</h1>
      <p class="authx__sub" id="fpSub">Enter your email and we will send you a 6-digit code.</p>

        <div class="auth-alert" id="authAlert" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" /><path d="M12 8v5M12 16.5v.01" />
          </svg>
          <span id="authAlertText"></span>
        </div>

        <form id="forgotForm" novalidate>
          <div class="field ffield--icon ffield">
            <span class="ffield__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="m3.5 7 7.3 5.2a2 2 0 0 0 2.4 0L20.5 7"/></svg></span>
            <input type="email" id="fpEmail" name="email" autocomplete="email" required placeholder=" " />
            <label for="fpEmail">Email address</label>
            <span class="field-error">That email address does not look right.</span>
          </div>

          <button type="submit" class="btn btn--accent btn--lg btn--block" id="forgotBtn">
            Send Code <span class="btn__arrow" aria-hidden="true">&rarr;</span>
          </button>
        </form>

        <!-- Shown once the code is on its way. The heading and the address
             are filled in by js/reset-precheck.js before the first paint. -->
        <div id="otpStage" hidden>
          <div class="otp-note">
            <span class="otp-note__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7L22 7"/></svg>
            </span>
            <p id="fpCodeHint">We sent a 6-digit code to <strong id="fpAddress">that address</strong>.</p>
          </div>

          <form id="otpForm" novalidate>
            <div class="field">
              <label for="fpCode">Enter the code</label>
              <input type="text" id="fpCode" name="code" class="otp-input"
                     inputmode="numeric" autocomplete="one-time-code"
                     maxlength="6" pattern="[0-9]{6}" placeholder="000000"
                     aria-describedby="fpCodeHint" required />
              <span class="field-error">That code is not 6 digits.</span>
            </div>

            <button type="submit" class="btn btn--accent btn--lg btn--block" id="otpBtn">
              Verify Code <span class="btn__arrow" aria-hidden="true">&rarr;</span>
            </button>
          </form>

          <p class="auth-note" id="devCodeBox" hidden style="margin-top:14px;text-align:left;">
            <strong>Development mode:</strong> no mail service is connected, so
            the code is <strong id="devCode" style="letter-spacing:.18em;"></strong>
          </p>

          <p class="otp-resend">
            Didn&rsquo;t get it?
            <button type="button" class="linkbtn" id="otpResend">Send a new code</button>
          </p>
        </div>


    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/forgot-page.js"></script>
</body>
</html>
